<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Squareman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#efe7d8;
    --paper2:#e5dac3;
    --line:#c9bd9c;
    --ink:#221d15;
    --ink-soft:#6b6252;
    --red:#c1443c;
    --blue:#2e5266;
    --ochre:#c1861f;
    --sage:#5f7d54;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden; overscroll-behavior:none;
    background:var(--paper);
    font-family:'Space Grotesk', system-ui, sans-serif;
    color:var(--ink);
    touch-action:none;
    user-select:none;
  }
  #wrap{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas{ display:block; width:100%; height:100%; }
  .num{ font-family:'IBM Plex Mono', monospace; font-variant-numeric:tabular-nums; }
  .display{ font-family:'Archivo Black', system-ui, sans-serif; }

  /* ---------- HUD ---------- */
  .hud{
    position:fixed; top:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:calc(env(safe-area-inset-top,0px) + 16px) 18px 0 18px;
    pointer-events:none;
    z-index:5;
  }
  .scoreBlock{
    background:var(--paper); border:2px solid var(--ink); border-radius:6px;
    padding:6px 14px; box-shadow:3px 3px 0 var(--ink);
  }
  .score{ font-size:30px; font-weight:700; line-height:1; }
  .best{ font-size:12px; color:var(--ink-soft); margin-top:3px; }
  .best b{ color:var(--ink); }
  .gemBlock{
    background:var(--paper); border:2px solid var(--ink); border-radius:6px;
    padding:7px 12px; box-shadow:3px 3px 0 var(--ink);
    display:flex; align-items:center; gap:6px;
    font-size:16px; font-weight:600; color:var(--blue);
  }
  .puStatus{ display:flex; gap:6px; margin-top:8px; justify-content:flex-end; }
  .puChip{
    width:32px; height:32px; border-radius:6px;
    display:flex; align-items:center; justify-content:center;
    background:var(--paper); border:2px solid var(--ink); color:var(--ink);
  }
  .puChip.used{ opacity:.3; }

  .overlay{
    position:fixed; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:26px 22px;
    background:var(--paper);
    z-index:10;
    overflow-y:auto;
  }
  .overlay.hidden{ display:none; }

  .mark{
    width:52px; height:52px; border:3px solid var(--ink); border-radius:8px;
    background:var(--slate,#45586b); margin-bottom:14px;
    position:relative;
  }
  .mark::after{
    content:''; position:absolute; top:-3px; left:12px; right:12px; height:8px;
    background:var(--red); border-left:3px solid var(--ink); border-right:3px solid var(--ink);
  }

  .title{ font-size:38px; margin:0 0 8px 0; color:var(--ink); letter-spacing:.5px; }
  .subtitle{ font-size:15px; color:var(--ink-soft); margin:0 0 20px 0; max-width:310px; line-height:1.55; font-weight:500; }

  .gemBadge{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--paper2); border:2px solid var(--ink);
    padding:7px 16px; border-radius:6px;
    font-size:17px; font-weight:600; color:var(--blue);
    margin-bottom:16px;
  }

  .btn{
    pointer-events:auto;
    background:var(--sage);
    border:2px solid var(--ink); color:var(--ink);
    font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:17px;
    padding:13px 34px; border-radius:6px;
    box-shadow:4px 4px 0 var(--ink);
    cursor:pointer;
    transition:transform .06s ease, box-shadow .06s ease;
  }
  .btn:active{ transform:translate(3px,3px); box-shadow:1px 1px 0 var(--ink); }
  .btn.secondary{
    background:var(--paper); font-size:15px; padding:10px 26px; margin-top:12px;
  }
  .btn:disabled{ opacity:.4; box-shadow:none; cursor:default; }

  .hint{ margin-top:16px; font-size:12.5px; color:var(--ink-soft); font-weight:500; }
  .taptext{
    position:fixed; bottom:calc(env(safe-area-inset-bottom,0px) + 24px);
    left:0; right:0; text-align:center;
    font-size:13px; font-weight:500; color:var(--ink-soft);
    z-index:5; pointer-events:none;
  }

  .loadoutLabel{ font-size:13px; color:var(--ink-soft); margin:2px 0 10px 0; font-weight:500; }
  .loadoutRow{ display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap; justify-content:center; }
  .loadoutSlot{
    pointer-events:auto;
    width:52px; height:52px; border-radius:8px;
    background:var(--paper2); border:2px solid var(--ink); color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; position:relative;
    transition:transform .06s ease;
  }
  .loadoutSlot.equipped{ background:var(--ochre); }
  .loadoutSlot.locked{ opacity:.35; }
  .loadoutSlot:active{ transform:scale(.94); }

  /* ---------- Shop ---------- */
  .shopPanel{ width:100%; max-width:420px; display:flex; flex-direction:column; align-items:center; }
  .tabs{ display:flex; gap:6px; margin-bottom:16px; pointer-events:auto; }
  .tabBtn{
    background:var(--paper); border:2px solid var(--ink); color:var(--ink-soft);
    font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:13px;
    padding:8px 14px; border-radius:6px; cursor:pointer;
  }
  .tabBtn.active{ background:var(--ink); color:var(--paper); }

  .shopGrid{
    display:grid; grid-template-columns:1fr 1fr; gap:10px;
    width:100%; margin-bottom:14px; pointer-events:auto;
    max-height:44vh; overflow-y:auto; padding:4px;
  }
  .card{
    background:var(--paper2); border:2px solid var(--ink); border-radius:8px;
    padding:12px 8px; display:flex; flex-direction:column; align-items:center; gap:7px;
  }
  .card.selected{ background:var(--ochre); }
  .swatch{ width:36px; height:36px; border-radius:7px; border:2px solid var(--ink); }
  .cardIcon{ color:var(--ink); }
  .cardName{ font-size:13.5px; font-weight:700; }
  .cardDesc{ font-size:10.5px; color:var(--ink-soft); line-height:1.35; min-height:26px; font-weight:500; }
  .cardBtn{
    font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:12px;
    border:2px solid var(--ink); border-radius:6px; padding:6px 12px; cursor:pointer;
    background:var(--sage); color:var(--ink);
  }
  .cardBtn.owned{ background:var(--paper); color:var(--ink-soft); }
  .cardBtn.selectedBtn{ background:var(--ink); color:var(--paper); }
  .cardBtn:disabled{ background:var(--paper); color:var(--line); border-color:var(--line); cursor:default; }

  #slowmoBtn{
    position:fixed; right:16px; bottom:calc(env(safe-area-inset-bottom,0px) + 20px);
    width:54px; height:54px; border-radius:8px;
    background:var(--paper); border:2px solid var(--ink); color:var(--ink);
    display:none; align-items:center; justify-content:center;
    z-index:6; pointer-events:auto; box-shadow:3px 3px 0 var(--ink);
  }
  #slowmoBtn.used{ opacity:.3; pointer-events:none; box-shadow:none; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>

<div class="hud" id="hud" style="display:none;">
  <div class="scoreBlock">
    <div class="score num" id="scoreLabel">0</div>
    <div class="best">best <b class="num" id="bestLabel">0</b></div>
  </div>
  <div>
    <div class="gemBlock"><span id="hudGemIcon"></span><span class="num" id="hudGems">0</span></div>
    <div class="puStatus" id="puStatus"></div>
  </div>
</div>

<div class="taptext" id="tapText" style="display:none;">tap anywhere to rotate 90&deg;</div>
<button id="slowmoBtn"></button>

<div class="overlay" id="startScreen">
  <div class="mark"></div>
  <h1 class="title display">Squareman</h1>
  <p class="subtitle">He's a square with a stickman's face and one cracked edge. Spikes fly in from every side &mdash; rotate him so the crack is never the edge that's facing one.</p>
  <div class="gemBadge"><span id="gemIconStart"></span><span class="num" id="gemCount">0</span></div>
  <div class="loadoutLabel">Tap a power-up to equip it, up to two</div>
  <div class="loadoutRow" id="loadoutRow"></div>
  <button class="btn" id="startBtn">Play</button>
  <button class="btn secondary" id="shopBtnStart">Shop</button>
</div>

<div class="overlay hidden" id="overScreen">
  <p class="title display num" id="finalScore" style="font-size:56px; margin-bottom:2px;">0</p>
  <p class="subtitle" style="margin-bottom:6px;">spikes dodged</p>
  <div class="gemBadge"><span id="gemIconOver"></span><span class="num" id="gemsEarned">0</span><span style="color:var(--ink-soft); font-weight:500; font-size:14px;">earned</span></div>
  <p class="subtitle" id="newBestMsg" style="display:none;">That's a new best.</p>
  <button class="btn" id="retryBtn">Try again</button>
  <button class="btn secondary" id="shopBtnOver">Shop</button>
</div>

<div class="overlay hidden" id="shopScreen">
  <div class="shopPanel">
    <h1 class="title display" style="font-size:26px;">Shop</h1>
    <div class="gemBadge"><span id="gemIconShop"></span><span class="num" id="shopGemCount">0</span></div>
    <div class="tabs">
      <button class="tabBtn" data-tab="colors">Colors</button>
      <button class="tabBtn" data-tab="powerups">Power-ups</button>
      <button class="tabBtn" data-tab="upgrades">Upgrades</button>
    </div>
    <div class="shopGrid" id="shopGrid"></div>
    <button class="btn secondary" id="shopCloseBtn">Close</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  // ---------------- icons (inline SVG, stroke = currentColor) ----------------
  const ICONS = {
    gem: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12l4 6-10 12L2 9z"/><path d="M2 9h20M9 3l3 6-3 12M15 3l-3 6 3 12"/></svg>',
    shield: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/></svg>',
    clock: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 2"/></svg>',
    heart: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20s-7-4.4-9.5-9C.7 7.8 2.3 4 6 4c2 0 3.3 1.1 4 2.2C10.7 5.1 12 4 14 4c3.7 0 5.3 3.8 3.5 7C15 15.6 12 20 12 20z"/></svg>',
    leaf: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 20c0-9 6-15 16-16 0 10-6 16-16 16z"/><path d="M5 19c3-4 6-7 12-11"/></svg>'
  };
  function icon(name, size){
    const s = size || 18;
    return ICONS[name].replace('width="18" height="18"', 'width="'+s+'" height="'+s+'"');
  }

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const hud = document.getElementById('hud');
  const tapText = document.getElementById('tapText');
  const scoreLabel = document.getElementById('scoreLabel');
  const bestLabel = document.getElementById('bestLabel');
  const hudGems = document.getElementById('hudGems');
  const puStatus = document.getElementById('puStatus');
  const startScreen = document.getElementById('startScreen');
  const overScreen = document.getElementById('overScreen');
  const shopScreen = document.getElementById('shopScreen');
  const finalScore = document.getElementById('finalScore');
  const newBestMsg = document.getElementById('newBestMsg');
  const startBtn = document.getElementById('startBtn');
  const retryBtn = document.getElementById('retryBtn');
  const shopBtnStart = document.getElementById('shopBtnStart');
  const shopBtnOver = document.getElementById('shopBtnOver');
  const shopCloseBtn = document.getElementById('shopCloseBtn');
  const shopGrid = document.getElementById('shopGrid');
  const gemCount = document.getElementById('gemCount');
  const shopGemCount = document.getElementById('shopGemCount');
  const gemsEarnedEl = document.getElementById('gemsEarned');
  const loadoutRow = document.getElementById('loadoutRow');
  const slowmoBtn = document.getElementById('slowmoBtn');

  document.getElementById('hudGemIcon').innerHTML = icon('gem',16);
  document.getElementById('gemIconStart').innerHTML = icon('gem',18);
  document.getElementById('gemIconOver').innerHTML = icon('gem',18);
  document.getElementById('gemIconShop').innerHTML = icon('gem',18);
  slowmoBtn.innerHTML = icon('clock',22);

  let DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  let W = 0, H = 0, CX = 0, CY = 0;
  function resize(){
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * DPR); canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    CX = W/2; CY = H/2;
  }
  window.addEventListener('resize', resize);

  // ---------------- persistence ----------------
  function load(key, fallback){
    try{ const v = localStorage.getItem(key); if (v===null) return fallback; return JSON.parse(v); }
    catch(e){ return fallback; }
  }
  function save(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }

  let best = load('squareman_best', 0);
  let gems = load('squareman_gems', 0);
  let ownedColors = load('squareman_colors', ['slate']);
  let selectedColor = load('squareman_selected_color', 'slate');
  let ownedPowerups = load('squareman_powerups', []);
  let equipped = load('squareman_equipped', []);
  let ownedUpgrades = load('squareman_upgrades', []);

  bestLabel.textContent = best;

  // ---------------- shop data ----------------
  const COLORS = [
    {id:'slate',   name:'Slate',   cost:0,   body:'#45586b', dark:'#28313c'},
    {id:'moss',    name:'Moss',    cost:60,  body:'#5c7a52', dark:'#37492f'},
    {id:'clay',    name:'Clay',    cost:90,  body:'#b5651d', dark:'#7a4211'},
    {id:'plum',    name:'Plum',    cost:130, body:'#6b4c7a', dark:'#43304f'},
    {id:'mustard', name:'Mustard', cost:180, body:'#d9a441', dark:'#96701c'},
    {id:'ink',     name:'Ink',     cost:240, body:'#2a241b', dark:'#efe7d8'}
  ];
  const POWERUPS = [
    {id:'shield',     name:'Shield',      icon:'shield', cost:150, desc:'Blocks the first hit to your crack each run.'},
    {id:'slowmo',     name:'Slow-mo',     icon:'clock',  cost:200, desc:'Tap the clock once per run to slow spikes for 3s.'},
    {id:'secondwind', name:'Second wind', icon:'heart',  cost:300, desc:'Revive once per run if your crack gets hit.'}
  ];
  const UPGRADES = [
    {id:'steady', name:'Steady start', icon:'leaf', cost:250, desc:'Spikes fly in slower for your first few dodges, every run.'}
  ];

  function colorById(id){ return COLORS.find(c=>c.id===id) || COLORS[0]; }
  function hasUpgrade(id){ return ownedUpgrades.indexOf(id) !== -1; }

  // ---------------- game state ----------------
  const STATE = { START:'start', PLAY:'play', OVER:'over' };
  let state = STATE.START;

  const player = { rotation:0, displayAngle:0, size:64, shake:0, flash:0, squish:1, glow:0 };

  let spikes = [];
  let particles = [];
  let score = 0;
  let elapsed = 0;
  let spawnTimer = 0;
  let nextSpawnAt = 900;
  let lastTime = 0;
  let rafId = null;

  let runShieldUsed = false;
  let runSecondWindUsed = false;
  let runSlowmoUsed = false;
  let slowUntil = 0;
  let invincibleUntil = 0;

  function playerSize(){ return Math.max(46, Math.min(W,H) * 0.16); }

  function reset(){
    player.rotation = 0; player.displayAngle = 0; player.shake = 0; player.flash = 0; player.squish = 1; player.glow = 0;
    spikes = []; particles = [];
    score = 0; elapsed = 0; spawnTimer = 0; nextSpawnAt = 1000;
    scoreLabel.textContent = '0';
    runShieldUsed = false; runSecondWindUsed = false; runSlowmoUsed = false;
    slowUntil = 0; invincibleUntil = 0;
    renderPuStatus();
    slowmoBtn.style.display = equipped.indexOf('slowmo') !== -1 ? 'flex' : 'none';
    slowmoBtn.classList.remove('used');
  }

  function difficultyTravelTime(s){
    let t = 1450 - s * 34;
    if (hasUpgrade('steady')) t += 150 * Math.max(0, 1 - s/10);
    return Math.max(430, t);
  }
  function difficultySpawnGap(s){ return Math.max(560, 1500 - s * 30); }
  function doubleChance(s){ return Math.min(0.45, Math.max(0, (s - 6) * 0.03)); }

  function spawnWave(){
    const t = elapsed;
    const travel = difficultyTravelTime(score);
    const dirs = [0,1,2,3];
    const d1 = dirs[Math.floor(Math.random()*4)];
    const useDouble = Math.random() < doubleChance(score);
    let chosen = [d1];
    if (useDouble){
      let d2 = dirs[Math.floor(Math.random()*4)];
      let tries = 0;
      while (d2 === d1 && tries < 6){ d2 = dirs[Math.floor(Math.random()*4)]; tries++; }
      if (d2 !== d1) chosen.push(d2);
    }
    chosen.forEach(dir=>{ spikes.push({ dir, spawnTime:t, travelTime:travel, resolved:false }); });
  }

  function rotatePlayer(){
    if (state !== STATE.PLAY) return;
    player.rotation = (player.rotation + 1) % 4;
    player.squish = 1.22;
  }

  function addBurst(x,y,color,count){
    for (let i=0;i<count;i++){
      const a = Math.random()*Math.PI*2;
      const sp = 60 + Math.random()*140;
      particles.push({ x,y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, color });
    }
  }

  function renderPuStatus(){
    puStatus.innerHTML = '';
    equipped.forEach(id=>{
      const pu = POWERUPS.find(p=>p.id===id);
      if (!pu) return;
      const used = (id==='shield' && runShieldUsed) || (id==='secondwind' && runSecondWindUsed) || (id==='slowmo' && runSlowmoUsed);
      const chip = document.createElement('div');
      chip.className = 'puChip' + (used ? ' used' : '');
      chip.innerHTML = icon(pu.icon,16);
      puStatus.appendChild(chip);
    });
  }

  function triggerHit(){
    if (equipped.indexOf('shield') !== -1 && !runShieldUsed){
      runShieldUsed = true; renderPuStatus();
      player.glow = 1;
      addBurst(CX,CY,'#2e5266', 22);
      return true;
    }
    if (equipped.indexOf('secondwind') !== -1 && !runSecondWindUsed){
      runSecondWindUsed = true; renderPuStatus();
      player.glow = 1;
      invincibleUntil = elapsed + 900;
      addBurst(CX,CY,'#c1861f', 26);
      return true;
    }
    return false;
  }

  function gameOver(){
    state = STATE.OVER;
    hud.style.display = 'none';
    tapText.style.display = 'none';
    slowmoBtn.style.display = 'none';
    finalScore.textContent = score;
    const earned = score;
    gems += earned;
    save('squareman_gems', gems);
    gemsEarnedEl.textContent = earned;
    if (score > best){
      best = score; save('squareman_best', best);
      newBestMsg.style.display = 'block';
    } else {
      newBestMsg.style.display = 'none';
    }
    bestLabel.textContent = best;
    overScreen.classList.remove('hidden');
    refreshGemLabels();
  }

  function startGame(){
    reset();
    state = STATE.PLAY;
    startScreen.classList.add('hidden');
    overScreen.classList.add('hidden');
    shopScreen.classList.add('hidden');
    hud.style.display = 'flex';
    tapText.style.display = 'block';
    hudGems.textContent = gems;
    lastTime = performance.now();
    if (!rafId) rafId = requestAnimationFrame(loop);
  }

  // ---------------- shop UI ----------------
  let activeTab = 'colors';
  function refreshGemLabels(){
    gemCount.textContent = gems; shopGemCount.textContent = gems; hudGems.textContent = gems;
  }

  function renderLoadout(){
    loadoutRow.innerHTML = '';
    POWERUPS.forEach(pu=>{
      const owned = ownedPowerups.indexOf(pu.id) !== -1;
      const isEquipped = equipped.indexOf(pu.id) !== -1;
      const slot = document.createElement('div');
      slot.className = 'loadoutSlot' + (isEquipped ? ' equipped' : '') + (owned ? '' : ' locked');
      slot.innerHTML = icon(pu.icon,22);
      slot.title = owned ? pu.name : pu.name + ' (locked)';
      slot.addEventListener('click', (e)=>{
        e.stopPropagation();
        if (!owned){ openShop('powerups'); return; }
        if (isEquipped){ equipped = equipped.filter(x=>x!==pu.id); }
        else { if (equipped.length >= 2) equipped.shift(); equipped.push(pu.id); }
        save('squareman_equipped', equipped);
        renderLoadout();
      });
      loadoutRow.appendChild(slot);
    });
  }

  function renderShop(){
    shopGrid.innerHTML = '';
    document.querySelectorAll('.tabBtn').forEach(b=>{ b.classList.toggle('active', b.dataset.tab === activeTab); });
    refreshGemLabels();

    if (activeTab === 'colors'){
      COLORS.forEach(c=>{
        const owned = ownedColors.indexOf(c.id) !== -1;
        const selected = selectedColor === c.id;
        const card = document.createElement('div');
        card.className = 'card' + (selected?' selected':'');
        const sw = document.createElement('div');
        sw.className = 'swatch'; sw.style.background = c.body;
        const name = document.createElement('div'); name.className = 'cardName'; name.textContent = c.name;
        const btn = document.createElement('button');
        btn.className = 'cardBtn' + (selected ? ' selectedBtn' : owned ? ' owned' : '');
        btn.textContent = selected ? 'Selected' : owned ? 'Select' : (c.cost + ' gems');
        if (!owned && gems < c.cost) btn.disabled = true;
        btn.addEventListener('click', (e)=>{
          e.stopPropagation();
          if (owned){ selectedColor = c.id; save('squareman_selected_color', selectedColor); }
          else if (gems >= c.cost){
            gems -= c.cost; save('squareman_gems', gems);
            ownedColors.push(c.id); save('squareman_colors', ownedColors);
            selectedColor = c.id; save('squareman_selected_color', selectedColor);
          }
          renderShop();
        });
        card.appendChild(sw); card.appendChild(name); card.appendChild(btn);
        shopGrid.appendChild(card);
      });
    } else if (activeTab === 'powerups'){
      POWERUPS.forEach(p=>{
        const owned = ownedPowerups.indexOf(p.id) !== -1;
        const card = document.createElement('div');
        card.className = 'card';
        const ic = document.createElement('div'); ic.className='cardIcon'; ic.innerHTML = icon(p.icon,26);
        const name = document.createElement('div'); name.className='cardName'; name.textContent = p.name;
        const desc = document.createElement('div'); desc.className='cardDesc'; desc.textContent = p.desc;
        const btn = document.createElement('button');
        btn.className = 'cardBtn' + (owned ? ' owned' : '');
        btn.textContent = owned ? 'Owned' : (p.cost + ' gems');
        if (owned || gems < p.cost) btn.disabled = owned ? true : gems < p.cost;
        btn.addEventListener('click', (e)=>{
          e.stopPropagation();
          if (!owned && gems >= p.cost){
            gems -= p.cost; save('squareman_gems', gems);
            ownedPowerups.push(p.id); save('squareman_powerups', ownedPowerups);
            renderShop(); renderLoadout();
          }
        });
        card.appendChild(ic); card.appendChild(name); card.appendChild(desc); card.appendChild(btn);
        shopGrid.appendChild(card);
      });
    } else if (activeTab === 'upgrades'){
      UPGRADES.forEach(u=>{
        const owned = hasUpgrade(u.id);
        const card = document.createElement('div');
        card.className = 'card';
        const ic = document.createElement('div'); ic.className='cardIcon'; ic.innerHTML = icon(u.icon,26);
        const name = document.createElement('div'); name.className='cardName'; name.textContent = u.name;
        const desc = document.createElement('div'); desc.className='cardDesc'; desc.textContent = u.desc;
        const btn = document.createElement('button');
        btn.className = 'cardBtn' + (owned ? ' owned' : '');
        btn.textContent = owned ? 'Owned' : (u.cost + ' gems');
        if (owned || gems < u.cost) btn.disabled = owned ? true : gems < u.cost;
        btn.addEventListener('click', (e)=>{
          e.stopPropagation();
          if (!owned && gems >= u.cost){
            gems -= u.cost; save('squareman_gems', gems);
            ownedUpgrades.push(u.id); save('squareman_upgrades', ownedUpgrades);
            renderShop();
          }
        });
        card.appendChild(ic); card.appendChild(name); card.appendChild(desc); card.appendChild(btn);
        shopGrid.appendChild(card);
      });
    }
  }

  function openShop(tab){
    activeTab = tab || 'colors';
    startScreen.classList.add('hidden');
    overScreen.classList.add('hidden');
    shopScreen.classList.remove('hidden');
    renderShop();
  }
  function closeShop(){
    shopScreen.classList.add('hidden');
    if (state === STATE.OVER) overScreen.classList.remove('hidden');
    else { startScreen.classList.remove('hidden'); renderLoadout(); }
    refreshGemLabels();
  }

  document.querySelectorAll('.tabBtn').forEach(b=>{
    b.addEventListener('click', (e)=>{ e.stopPropagation(); activeTab = b.dataset.tab; renderShop(); });
  });
  shopBtnStart.addEventListener('click', (e)=>{ e.stopPropagation(); openShop('colors'); });
  shopBtnOver.addEventListener('click', (e)=>{ e.stopPropagation(); openShop('colors'); });
  shopCloseBtn.addEventListener('click', (e)=>{ e.stopPropagation(); closeShop(); });

  // ---------------- input ----------------
  let lastTapTime = 0;
  function handleTap(){
    const now = performance.now();
    if (now - lastTapTime < 60) return;
    lastTapTime = now;
    if (state === STATE.PLAY) rotatePlayer();
  }
  window.addEventListener('touchstart', function(e){
    if (e.target === slowmoBtn) return;
    e.preventDefault(); handleTap();
  }, {passive:false});
  window.addEventListener('mousedown', function(e){
    if (e.target === slowmoBtn) return;
    handleTap();
  });
  window.addEventListener('keydown', function(e){
    if (e.code === 'Space' || e.code === 'ArrowUp'){ e.preventDefault(); handleTap(); }
  });

  slowmoBtn.addEventListener('click', function(e){
    e.stopPropagation();
    if (state !== STATE.PLAY) return;
    if (equipped.indexOf('slowmo') === -1 || runSlowmoUsed) return;
    runSlowmoUsed = true;
    slowUntil = elapsed + 3000;
    slowmoBtn.classList.add('used');
    renderPuStatus();
    addBurst(CX,CY,'#2e5266', 16);
  });

  startBtn.addEventListener('click', function(e){ e.stopPropagation(); startGame(); });
  retryBtn.addEventListener('click', function(e){ e.stopPropagation(); startGame(); });

  // ---------------- drawing ----------------
  function dirVector(dir){
    switch(dir){
      case 0: return {x:0,y:-1};
      case 1: return {x:1,y:0};
      case 2: return {x:0,y:1};
      case 3: return {x:-1,y:0};
    }
  }

  function drawBackground(){
    ctx.fillStyle = '#efe7d8';
    ctx.fillRect(0,0,W,H);
    ctx.save();
    const spacing = 34;
    ctx.strokeStyle = '#ddd2b6';
    ctx.lineWidth = 1;
    let col = 0;
    for (let x=0; x<=W; x+=spacing){
      ctx.globalAlpha = (col % 4 === 0) ? 0.9 : 0.45;
      ctx.beginPath(); ctx.moveTo(x+0.5,0); ctx.lineTo(x+0.5,H); ctx.stroke();
      col++;
    }
    let row = 0;
    for (let y=0; y<=H; y+=spacing){
      ctx.globalAlpha = (row % 4 === 0) ? 0.9 : 0.45;
      ctx.beginPath(); ctx.moveTo(0,y+0.5); ctx.lineTo(W,y+0.5); ctx.stroke();
      row++;
    }
    ctx.restore();
  }

  function drawPlayer(){
    const size = playerSize();
    player.size = size;
    const target = player.rotation * Math.PI/2;
    let diff = target - player.displayAngle;
    while (diff > Math.PI) diff -= Math.PI*2;
    while (diff < -Math.PI) diff += Math.PI*2;
    player.displayAngle += diff * 0.28;

    player.squish += (1 - player.squish) * 0.2;
    if (player.shake > 0) player.shake *= 0.85;

    const shakeX = (Math.random()-0.5) * player.shake;
    const shakeY = (Math.random()-0.5) * player.shake;

    ctx.save();
    ctx.translate(CX + shakeX, CY + shakeY);
    ctx.rotate(player.displayAngle);
    ctx.scale(1/player.squish, player.squish);

    const half = size/2;
    const col = colorById(selectedColor);

    if (player.glow > 0.02){
      ctx.save();
      ctx.globalAlpha = player.glow * 0.35;
      ctx.beginPath(); ctx.arc(0,0, half*1.7, 0, Math.PI*2);
      ctx.fillStyle = '#2e5266'; ctx.fill();
      ctx.restore();
      player.glow *= 0.9;
    }

    ctx.strokeStyle = '#221d15';
    ctx.lineWidth = Math.max(3, size*0.045);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-half, -half*0.15); ctx.lineTo(-half*1.55, half*0.35);
    ctx.moveTo(half, -half*0.15); ctx.lineTo(half*1.55, half*0.35);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-half*0.4, half); ctx.lineTo(-half*0.55, half*1.6);
    ctx.moveTo(half*0.4, half); ctx.lineTo(half*0.55, half*1.6);
    ctx.stroke();

    const r = size*0.14;
    ctx.beginPath();
    ctx.moveTo(-half+r, -half);
    ctx.arcTo(half, -half, half, half, r);
    ctx.arcTo(half, half, -half, half, r);
    ctx.arcTo(-half, half, -half, -half, r);
    ctx.arcTo(-half, -half, half, -half, r);
    ctx.closePath();

    const bodyColor = player.flash > 0.02 ? '#c1443c' : col.body;
    ctx.fillStyle = bodyColor; ctx.fill();
    ctx.lineWidth = Math.max(3, size*0.06);
    ctx.strokeStyle = '#221d15'; ctx.stroke();
    if (player.flash > 0) player.flash *= 0.85;

    ctx.save();
    ctx.beginPath();
    ctx.rect(-half, -half, size, size*0.16);
    ctx.clip();
    ctx.strokeStyle = '#c1443c';
    ctx.lineWidth = Math.max(3, size*0.055);
    ctx.beginPath();
    const jag = size*0.09;
    ctx.moveTo(-half*0.7, -half); ctx.lineTo(-half*0.35, -half+jag);
    ctx.lineTo(0, -half); ctx.lineTo(half*0.35, -half+jag); ctx.lineTo(half*0.7, -half);
    ctx.stroke();
    ctx.restore();

    ctx.fillStyle = '#efe7d8';
    const eyeOff = size*0.16; const eyeR = Math.max(2, size*0.045);
    ctx.beginPath();
    ctx.arc(-eyeOff, size*0.02, eyeR, 0, Math.PI*2);
    ctx.arc(eyeOff, size*0.02, eyeR, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#efe7d8';
    ctx.lineWidth = Math.max(2, size*0.035);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(0, size*0.05, size*0.14, 0.15*Math.PI, 0.85*Math.PI);
    ctx.stroke();

    ctx.restore();
  }

  function easeIn(t){ return t*t; }

  function drawSpike(sp){
    const progress = Math.min(1, (elapsed - sp.spawnTime) / sp.travelTime);
    const startDist = Math.hypot(W,H) * 0.62;
    const endDist = playerSize()*0.62 + 14;
    const dist = startDist + (endDist - startDist) * easeIn(progress);
    const v = dirVector(sp.dir);
    const x = CX + v.x*dist, y = CY + v.y*dist;
    const angle = Math.atan2(-v.y, -v.x) + Math.PI/2;

    if (progress < 0.35){
      ctx.save();
      ctx.globalAlpha = 0.55 * (1 - progress/0.35);
      ctx.strokeStyle = '#221d15'; ctx.setLineDash([5,9]); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(CX,CY); ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }

    const len = playerSize()*0.62, wid = playerSize()*0.34;
    ctx.save();
    ctx.translate(x,y); ctx.rotate(angle);
    ctx.beginPath();
    ctx.moveTo(0,-len*0.6); ctx.lineTo(wid*0.5, len*0.55); ctx.lineTo(-wid*0.5, len*0.55); ctx.closePath();
    ctx.fillStyle = '#221d15'; ctx.fill();
    ctx.beginPath(); ctx.moveTo(0,-len*0.4); ctx.lineTo(0,len*0.35);
    ctx.strokeStyle = '#c1443c'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.restore();
  }

  function drawParticles(dt){
    for (let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.x += p.vx*dt; p.y += p.vy*dt;
      p.vx *= 0.92; p.vy *= 0.92;
      p.life -= dt*1.6;
      if (p.life <= 0){ particles.splice(i,1); continue; }
      ctx.save();
      ctx.globalAlpha = Math.max(0,p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y, 3.2*p.life+1, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }
  }

  // ---------------- main loop ----------------
  function loop(now){
    rafId = requestAnimationFrame(loop);
    const dt = Math.min(0.05, (now - lastTime)/1000);
    lastTime = now;

    if (state === STATE.PLAY){
      const timeScale = (elapsed < slowUntil) ? 0.5 : 1;
      const stepMs = dt*1000*timeScale;
      elapsed += stepMs;
      spawnTimer += stepMs;
      if (spawnTimer >= nextSpawnAt){
        spawnTimer = 0;
        nextSpawnAt = difficultySpawnGap(score) + Math.random()*220;
        spawnWave();
      }

      for (let i=spikes.length-1;i>=0;i--){
        const sp = spikes[i];
        const progress = (elapsed - sp.spawnTime) / sp.travelTime;
        if (!sp.resolved && progress >= 1){
          sp.resolved = true;
          const isHit = sp.dir === player.rotation && elapsed > invincibleUntil;
          if (isHit){
            const survived = triggerHit();
            if (survived){
              score += 1; scoreLabel.textContent = String(score);
              spikes.splice(i,1);
            } else {
              player.flash = 1; player.shake = 18;
              addBurst(CX,CY,'#c1443c',26);
              spikes.splice(i,1);
              gameOver();
              break;
            }
          } else {
            score += 1; scoreLabel.textContent = String(score);
            const v = dirVector(sp.dir);
            addBurst(CX + v.x*playerSize()*0.55, CY + v.y*playerSize()*0.55, '#c1861f', 10);
            spikes.splice(i,1);
          }
        } else if (progress >= 1.001){
          spikes.splice(i,1);
        }
      }
    }

    drawBackground();
    for (const sp of spikes) drawSpike(sp);
    drawPlayer();
    drawParticles(dt);

    if (state === STATE.START){
      player.rotation = Math.floor(now/1400) % 4;
    }
  }

  resize();
  renderLoadout();
  refreshGemLabels();
  requestAnimationFrame(function first(t){
    lastTime = t;
    drawBackground();
    drawPlayer();
    rafId = requestAnimationFrame(loop);
  });
})();
</script>
